name: secure-ci-cd-workflow

on:
  pull_request:
    branches: [ "main" ]
  paths:
    - terraform/**

  # allows running this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1   # only pulls current commit, 0 pulls all history

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f #v3.0.0


  checkov_terraform_scan_job:
    permissions:
      security-events: write # required to upload SARIF data to github security tab

    runs-on: ubuntu-latest
    needs:
      - gitleaks_scan_job

    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v3.4.3
        with:
          directory: terraform/modules/network
          framework: terraform
          output_format: sarif  # json, cli
          output_file_path: results.sarif
          # soft_fail: true   # pipeline won't fail on checkov findings

      - name: Upload Checkov Terraform Results in SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() # forces this step to run even if Checkov finds errors
        with:
          sarif_file: results.sarif

  checkov_docker_scan_job:
    permissions:
      security-events: write # required to upload SARIF data to github security tab

    runs-on: ubuntu-latest
    needs:
      - gitleaks_scan_job

    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkov Docker scan
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v3.4.3
        with:
          directory: application-job-scheduler/Dockerfile
          framework: dockerfile
          output_format: sarif  # json, cli
          output_file_path: results.sarif
          # soft_fail: true   # pipeline won't fail on checkov findings

      - name: Upload Checkov Dockerfile Results in SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() # forces this step to run even if Checkov finds errors
        with:
          sarif_file: results.sarif


  trivy_file_system_scan_job:
    permissions:
      security-events: write # required to upload SARIF data to github security tab

    runs-on: ubuntu-latest
    needs:
      - gitleaks_scan_job

    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scan Git Repo Using Trivy Filesystem Scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.36.0
        with: 
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem-scan'

      - name: Make Trivy Report Artifact Downloadable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30


  app_lint_job:
    runs-on: ubuntu-latest
    needs:
      - checkov_terraform_scan_job
      - checkov_docker_scan_job
      - trivy_file_system_scan_job

    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: 'npm'           # automatically caches dependencies

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Script
        run: npm run lint