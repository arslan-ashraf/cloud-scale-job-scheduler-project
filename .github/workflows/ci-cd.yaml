name: secure-ci-cd-workflow

on:
  pull_request:
    branches: [ "main" ]
  paths:
    - terraform/**

  # allows running this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  gitleaks_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1   # only pulls current commit, 0 pulls all history

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3


  checkov_terraform_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/modules/network
          framework: terraform
          output_format: sarif  # json, cli
          output_file_path: results.sarif
          # soft_fail: true   # pipeline won't fail on checkov findings

      - name: Upload Checkov Terraform Results in SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # forces this step to run even if Checkov finds errors
        with:
          sarif_file: results.sarif

  checkov_docker_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkov Docker scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: application-job-scheduler/Dockerfile
          framework: dockerfile
          output_format: sarif  # json, cli
          output_file_path: results.sarif
          # soft_fail: true   # pipeline won't fail on checkov findings

      - name: Upload Checkov Dockerfile Results in SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # forces this step to run even if Checkov finds errors
        with:
          sarif_file: results.sarif